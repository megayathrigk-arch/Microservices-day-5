server:
  port: 8080

spring:
  application:
    name: API-Gateway

  cloud:
    gateway:
      server:
        webflux:
          routes:

            - id: user-service
              uri: http://localhost:8087
              predicates:
                - Path=/api/users/**

            - id: order-service
              uri: http://localhost:8088
              predicates:
                - Path=/api/orders/**

            - id: payment-service
              uri: http://localhost:8089
              predicates:
                - Path=/payments/**